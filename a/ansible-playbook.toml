# Typical usage:  climate run ansible-playbook -i inventory site.yml

[app]
name = "ansible-playbook"
description = "Run Ansible playbooks"
license = "GPL-3.0-or-later"

[image]
reference = "docker.io/alpine/ansible:latest"

[run]
entrypoint = "ansible-playbook"
# Reaches the managed hosts over SSH.
network = "full"
# Installed collections and roles, plus the SSH keys and known hosts; the image runs the tool
# as root.
mount = [
    "~/.ansible/:/root/.ansible",
    "~/.ssh/:/root/.ssh",
]
